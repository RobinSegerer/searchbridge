name: SearchBridge Streamlit app integration smoke

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/streamlit-smoke.yml
      - app.py
      - review_pipeline_ui.py
      - review_retrieval.py
      - review_core.py
      - openai_review_screening.py

jobs:
  streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Streamlit initial render without external keys
        run: |
          python - <<'PY'
          import streamlit
          from streamlit.testing.v1 import AppTest
          result = AppTest.from_file("app.py").run(timeout=100)
          print("streamlit version", streamlit.__version__)
          print("exception count", len(result.exception))
          for issue in result.exception:
              print("UI EXCEPTION:", issue.message)
          assert not result.exception, "Streamlit initial app render failed"
          print("SearchBridge UI successfully rendered")

          # Exercise the complete user strategy in the actual Streamlit UI.
          from test_pubmed_translation import FULL
          result.text_area[0].input(FULL)
          result.button(key="translate").click()
          result.run(timeout=100)
          for issue in result.exception:
              print("TRANSLATION UI EXCEPTION:", issue.message)
          assert not result.exception, "Translate interaction failed"
          outputs = result.session_state["translations"]
          assert "PubMed" in outputs, "PubMed translation tab missing"
          assert "PubMed" in outputs["PubMed"]["endpoint"]
          assert '"Students"[mh]' in outputs["PubMed"]["query"]
          assert outputs["PubMed"]["query"]
          print("PubMed translation tab rendered for full user Ovid search")

          # Seed one realistic deduplicated study and render the full
          # final human screening card, including complete abstract.
          from review_core import ReviewRecord, merge_records
          citation = ReviewRecord(
              uid="smoke-review-1", title="Social media in university students",
              abstract="This is the full smoke-test abstract about digital media and students.",
              source="PubMed", source_id="12345678", doi="10.1234/demo",
              year="2025",
          )
          merged = merge_records([citation])
          result.session_state["review_data"] = (
              merged,
              [{"source": "PubMed", "status": "imported",
                "total_hits": 1, "retrieved": 1, "complete": True}]
          )
          result.session_state["review_dedup_engine"] = "Python DOI/PMID/title+year"
          result.run(timeout=100)
          for issue in result.exception:
              print("SCREENING UI EXCEPTION:", issue.message)
          assert not result.exception, "Review Pipeline screening card failed"
          assert any(
              "full smoke-test abstract" in str(item.value)
              for item in result.markdown
          ), "Full abstract is not visible in human review UI"
          assert result.session_state["review_openai_model"] == "gpt-6.1-terra", (
              "Default screening model must be GPT-6.1 Terra"
          )
          print("Human review full abstract and Terra default verified")

          # Simulate a PubMed API source with page-by-page progress. No real
          # network requests and no R packages are required for this UI check.
          from unittest.mock import patch
          from review_retrieval import SourceResult
          progress_events = []
          def mocked_pubmed(query, limit, email="", api_key="", progress=None):
              progress(1, 2)
              progress_events.append((1, 2))
              progress(2, 2)
              progress_events.append((2, 2))
              return SourceResult(
                  "PubMed",
                  [
                      ReviewRecord(
                          uid="mocked-review-1",
                          title="Social media study in students",
                          abstract="Original full abstract for the mocked retrieval.",
                          year="2025", doi="10.1000/mock",
                          source="PubMed", source_id="111"
                      ),
                      ReviewRecord(
                          uid="mocked-review-2",
                          title="Social media study in students",
                          abstract="Duplicate with a better abstract.",
                          year="2025", doi="10.1000/mock",
                          source="PubMed", source_id="222"
                      ),
                  ],
                  2, query, True
              )
          with patch("review_pipeline_ui.pubmed_search", mocked_pubmed):
              result.button(key="review_fetch_and_merge").click()
              result.run(timeout=100)
          for issue in result.exception:
              print("PIPELINE PROGRESS UI EXCEPTION:", issue.message)
          assert not result.exception, "Progress-enabled pipeline failed"
          assert progress_events == [(1, 2), (2, 2)]
          merged, audit = result.session_state["review_data"]
          assert merged.input_count == 2 and merged.duplicates_removed == 1
          assert len(merged.records) == 1
          assert any(line.get("dedup_engine", "").startswith("Python")
                     for line in audit)
          print("Progress-enabled source retrieval and fast DOI dedup verified")
          PY
