name: Python syntax check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Test deterministic semantic ranking
        run: python -m unittest discover -s tests -p test_review_semantic_rank.py
      - name: Validate original bird logo PNG and CRC
        run: python -m unittest discover -s tests -p test_brand_logo.py
